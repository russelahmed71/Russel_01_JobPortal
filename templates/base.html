<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Portal</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #ffffff;
            color: #333333;
        }
        .my-navbar {
            padding: 10px 0px;
            margin-bottom: 30px;
            border-bottom: 1px solid #eeeeee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar-logo {
            color: #333333;
            font-size: 22px;
            font-weight: bold;
            text-decoration: none;
        }
        .navbar-links a {
            color: #007bff;
            text-decoration: none;
            margin-left: 20px;
            font-size: 16px;
            font-weight: 500;
        }
        .navbar-links a:hover {
            text-decoration: underline;
        }
        .logout-link {
            color: #dc3545 !important;
        }
        .main-container {
            max-width: 900px;
            margin: 0 auto;
        }
        .alert-box {
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .alert-warning { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .btn {
            background-color: #007bff;
            color: white;
            padding: 8px 16px;
            border: 1px solid #007bff;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            font-size: 14px;
        }
        .btn:hover { background-color: #0056b3; }
        .btn-success { background-color: #28a745; border-color: #28a745; }
        .btn-success:hover { background-color: #218838; }
        .job-card {
            border: 1px solid #dddddd;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="my-navbar">
        <a href="{% url 'dashboard' %}" class="navbar-logo">JobPortal</a>
        <div class="navbar-links">
            <a href="{% url 'dashboard' %}">Dashboard</a>
            <a href="{% url 'job_search' %}">Search Jobs</a>
            <a href="{% url 'profile_edit' %}">Edit Profile</a>
            <a href="{% url 'logout' %}" class="logout-link">Logout</a>
        </div>
    </div>

    <div class="main-container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert-box {% if message.tags == 'success' %}alert-success{% elif message.tags == 'error' %}alert-error{% else %}alert-warning{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <div>
            {% block content %}
            {% endblock %}
        </div>
    </div>

</body>
</html>
