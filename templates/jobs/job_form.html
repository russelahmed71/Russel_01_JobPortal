{% extends 'jobs/base.html' %}
{% block content %}
<div class="card" style="max-width: 700px; margin: 30px auto;">
    <h3 class="fw-bold text-primary mb-1">{{ title }}</h3>
    <p class="text-muted" style="margin-top: 0; margin-bottom: 25px;">Enter position criteria tracking tags below</p>
    
    <form method="POST">
        {% csrf_token %}
        <div class="form-row">
            {{ form.as_p }}
        </div>
        <div class="flex-buttons">
            <button type="submit" class="btn-submit">Publish Position Opening</button>
            <a href="{% url 'dashboard' %}" class="btn-submit btn-cancel">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
