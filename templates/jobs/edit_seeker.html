{% extends 'jobs/base.html' %}
{% block content %}
<div class="card card-centered">
    <h3 class="fw-bold text-success mb-4">🎯 Edit Skills & Upload Resume</h3>
    <!-- ⚠️ Note: enctype="multipart/form-data" added for file attachments -->
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-row">
            <label>My Profile Talent Tags List</label>
            <input type="text" name="skills" value="{{ profile.skills }}" placeholder="e.g. Python, Django, SQL, Javascript">
            <div class="text-muted" style="margin-top: 6px; line-height: 1.3; font-size: 0.8rem;">Separate items using commas.</div>
        </div>
        
        <div class="form-row" style="margin-top: 20px;">
            <label>📄 Upload Resume / CV (PDF or Doc)</label>
            <input type="file" name="resume" class="form-control">
            {% if profile.resume %}
                <div class="text-success" style="margin-top: 8px; font-size: 0.85rem; font-weight: 600;">
                    Current Resume Active: <a href="{{ profile.resume.url }}" target="_blank" style="color: #198754;">View Uploaded Document</a>
                </div>
            {% endif %}
        </div>
        
        <div class="flex-buttons" style="margin-top: 25px;">
            <button type="submit" class="btn-submit btn-success-action">Update Profile Matrix</button>
            <a href="{% url 'dashboard' %}" class="btn-submit btn-cancel">Back</a>
        </div>
    </form>
</div>
{% endblock %}
