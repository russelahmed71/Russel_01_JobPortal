{% extends 'jobs/base.html' %}
{% block content %}
<div class="card card-centered">
    <div class="text-center mb-4">
        <h3 class="fw-bold text-primary">🔐 Access Portal</h3>
        <p class="text-muted">Enter credentials to load account configuration metric views</p>
    </div>
    
    <form method="POST">
        {% csrf_token %}
        {% if form.non_field_errors %}
            <div class="alert alert-danger">{{ form.non_field_errors }}</div>
        {% endif %}
        
        <div class="form-row">
            <label>Username</label>
            <input type="text" name="username" required placeholder="Enter username" autofocus>
        </div>
        
        <div class="form-row">
            <label>Password</label>
            <input type="password" name="password" required placeholder="Enter password">
        </div>
        
        <button type="submit" class="btn-submit">Sign In</button>
    </form>
    
    <div class="mt-4 text-center text-muted border-top pt-3">
        Need a professional workspace? <a href="{% url 'register' %}" style="text-decoration: none; font-weight: bold;">Register here</a>
    </div>
</div>
{% endblock %}
