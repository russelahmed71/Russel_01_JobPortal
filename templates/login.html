{% extends 'base.html' %}
{% block content %}
    <h2>Account Login</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Log In</button>
    </form>
    <p style="margin-top: 15px;">
        Need an account? <a href="{% url 'register' %}">Register here</a>
    </p>
{% endblock %}
