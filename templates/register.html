{% extends 'base.html' %}
{% block content %}
    <h2>Create an Account</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Register</button>
    </form>
    <p style="margin-top: 15px;">
        Already have an account? <a href="{% url 'login' %}">Login here</a>
    </p>
{% endblock %}
